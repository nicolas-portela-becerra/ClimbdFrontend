# The real client IP and scheme. Behind the Cloudflare tunnel, CF-Connecting-IP is set by Cloudflare's
# edge and cannot be forged by the client. The client's own X-Forwarded-For is never passed on, so the
# backend's per-IP rate limit can't be bypassed with a fake header.
# Only safe while this container is reachable exclusively through the tunnel (no published host port).
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
map $http_cf_connecting_ip $client_proto {
    ""      $scheme;
    default https;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # API calls go to the backend container on the same compose network
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;
        client_max_body_size 20m;
    }

    # Hashed build assets never change
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Must always be revalidated so PWA updates arrive
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
